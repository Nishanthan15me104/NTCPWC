name: Maritime RAG CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest     # The free Linux VM GitHub provides

    steps:
      - name: Checkout Code    # Step 1: Copy your code to the VM
        uses: actions/checkout@v4

      - name: Set up Python    # Step 2: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # We install only what's needed for the test to save time
          pip install pytest python-dotenv
          # If you have a requirements file, uncomment the line below:
          # pip install -r requirements.txt 

      - name: Run Environment Tests
        env:
          # This links your GitHub Secret to the test environment
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pytest test_env.py