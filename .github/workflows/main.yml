name: Maritime RAG Full System Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # This speeds up your runs by remembering installed libs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Added system libs for OpenCV and your specific RAG libraries
          sudo apt-get update && sudo apt-get install -y libgl1 libglx-mesa0
          pip install pytest python-dotenv torch torchvision transformers langchain-community faiss-cpu sentence-transformers pdf2image pymupdf llama-index-llms-groq

      - name: 1. Run Environment Tests
        # We keep this! It's your "Gatekeeper"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pytest test_env.py

      - name: 2. Generate Mock Data for System Check
        # This creates the tiny files so the next steps don't crash
        run: |
          mkdir -p data/extracted/images
          echo '{"text": [{"text": "The vessel shall be equipped with shore-side power connection points. Safety protocols for maritime operations include emergency shut-off valves.", "page_num": 1}], "images": []}' > data/extracted/metadata.json
          python -c "from PIL import Image; Image.new('RGB', (200, 200), color='red').save('data/extracted/images/img_1_1.png')"

      - name: 3. Test Text Indexing Logic
        run: python src/build_text_index.py

      - name: 4. Test Image Indexing Logic
        run: python src/build_image_index.py

      - name: 5. Final FAISS Validation
        run: |
          if [ -f "data/faiss/text/index.faiss" ] && [ -f "data/faiss/images/index.faiss" ]; then
            echo " All systems go! Environment is set and Indexing works."
          else
            echo " Logic error: Scripts ran but files weren't saved."
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test # Safety gate: If indexing fails, don't deploy!
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'maritime-rag-app3' # Use the exact name you pick in Azure
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}